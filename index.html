<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#073a7a">
<title>Perishable Quest — Misi 19 Administrasi Perishable</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0b4ea2;--bd:#073a7a;--r:#e30613;--g:#ffc928;--ok:#10b981;--no:#ef4444;--ink:#14213d;--mu:#5d6b85;--ln:#dfe6f1;--sp:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%}
body{font:600 14px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#1d6fd6,#073a7a 60%,#051d44);display:grid;place-items:center}
button,input{font:inherit;color:inherit;border:0}button{cursor:pointer}
h1,.d{font-family:"Baloo 2","Plus Jakarta Sans",sans-serif;font-weight:800}
#app{position:relative;width:min(430px,100vw);height:min(680px,100vh);height:min(680px,100dvh);background:#f0f5fc;overflow:hidden;box-shadow:0 24px 60px #0007}
@media(min-width:440px){#app{border-radius:26px}}
.s{position:absolute;inset:0;display:none;flex-direction:column}.s.on{display:flex}
.hero{background:linear-gradient(160deg,var(--bd),var(--b));color:#fff;padding:16px 18px 20px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--r) 0 33%,#fff 33% 36%,var(--g) 36% 70%,var(--r) 70%)}
.logo{display:inline-block;background:#fff;color:var(--bd);border:2px solid var(--g);border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px}.logo b{background:var(--r);color:#fff;border-radius:5px;padding:0 5px;margin-left:5px;font-size:11px}
.hero h1{font-size:34px;line-height:.95;margin:12px 0 6px}.hero p{font-size:12.5px;opacity:.9}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tags span{background:#ffffff26;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.sc{flex:1;overflow:auto;padding:14px 16px}
.lb{font-size:12px;color:var(--mu);margin:2px 0 6px;font-weight:800}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pk button{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--ln);border-radius:18px;padding:4px 4px 8px;font-weight:800;transition:.25s var(--sp)}
.pk button.on{border-color:var(--b);transform:scale(1.05);box-shadow:0 8px 18px #0b4ea244;background:#e8f0fb}
.f{width:100%;background:#fff;border:2px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-weight:700}.f:focus{outline:0;border-color:var(--b)}
.go{width:100%;background:var(--r);color:#fff;border-radius:16px;padding:12px;font:800 18px "Baloo 2",sans-serif;box-shadow:0 5px 0 #a3040e;transition:.1s}.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a3040e}.go:disabled{background:#b9c3d3;box-shadow:0 5px 0 #98a4b8}
.sm{background:#fff;color:var(--b);border:2px solid var(--b);box-shadow:0 4px 0 #c7dbf7;font-size:15px;margin-top:10px}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(135deg,var(--bd),var(--b));color:#fff}
.flag{width:36px;height:36px;border-radius:50%;background:#ffffff2b;font-size:18px}
.who{flex:1;min-width:0;line-height:1.15}.who b,.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{font-size:11px;opacity:.8}
.pill{background:#ffffff26;border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px}.pill.fire{background:var(--g);color:var(--ink);animation:pop .4s var(--sp)}
.prog{display:flex;gap:3px;padding:8px 12px 0}.prog i{flex:1;height:6px;border-radius:9px;background:#d5e0f0;transition:.3s}.prog .c{background:var(--g);transform:scaleY(1.7)}.prog .y{background:var(--ok)}.prog .n{background:var(--no)}
.stage{display:flex;gap:8px;align-items:flex-end;padding:8px 12px 0}
.m{height:100px;flex:none;position:relative;display:flex;justify-content:center}
.cm{position:relative;height:100%;transform-origin:50% 100%}
.cw{position:absolute;inset:0;background:center bottom/contain no-repeat;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.cw svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}

.cm-idle{animation:brt 3.4s ease-in-out infinite}
.cm-happy{animation:jmp .9s cubic-bezier(.3,1.4,.5,1),sway 1.7s ease-in-out .9s infinite}
.cm-sad{animation:shk .6s,drp 2.6s ease-in-out .6s infinite;filter:saturate(.78) brightness(.96)}
@keyframes brt{50%{transform:translateY(-2px) scale(1.015)}}
@keyframes jmp{0%{transform:scale(1)}15%{transform:scale(1.08,.9)}40%{transform:translateY(-22px) scale(.95,1.08) rotate(-5deg)}65%{transform:scale(1.07,.92) rotate(3deg)}85%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes shk{20%,60%{transform:translateX(-8px) rotate(-3deg)}40%,80%{transform:translateX(8px) rotate(3deg)}}
@keyframes drp{0%,100%{transform:translateY(6px) rotate(-4deg) scale(1,.95)}50%{transform:translateY(9px) rotate(-1.5deg) scale(1,.94)}}
.fxl{position:absolute;inset:-12px -26px 0;pointer-events:none}.fxl span{position:absolute;font-size:17px;animation:up 1.5s ease-out forwards;opacity:0}
.fxl .cld{font-size:22px;animation:cld 2.2s ease-in-out infinite;opacity:1;left:50%;top:-8px}
@keyframes up{0%{opacity:0;transform:translateY(8px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.15) rotate(20deg)}}
@keyframes cld{50%{transform:translateY(-4px)}}
.bk2{opacity:0;animation:blk 4.6s infinite}@keyframes blk{0%,93%,100%{opacity:0}95%,97%{opacity:1}}
.tr{animation:tear 1.4s ease-in infinite}@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.pk button .m{height:76px}
.bub{flex:1;background:#fff;border:2px solid var(--b);border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;box-shadow:0 6px 14px #0b4ea21a;margin-bottom:6px}
.ch{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:99px;padding:1px 9px;margin-bottom:3px}
.body{flex:1;overflow:auto;padding:10px 12px}.bar{padding:6px 12px 12px;min-height:8px}
.hint{font-size:12px;color:var(--mu);margin-bottom:8px;font-weight:700}

.bt{border-radius:14px;padding:13px 6px;font-weight:800;color:#fff;box-shadow:0 4px 0 #0003;transition:.1s}.bt:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}

<script>
const Q=[
{c:'PPBR',t:'mc',q:'Kenapa setiap kegiatan perishable harus dicatat?',o:['Sebagai kontrol kerja, dan dipakai atasan untuk menganalisis hal baik dan buruk karyawan','Supaya terlihat sibuk','Supaya bisa pulang lebih cepat','Hanya perlu jika ada masalah'],e:'Kerja tidak boleh asal-asalan tanpa pencatatan. Administrasi berfungsi sebagai kontrol kerja dan dibutuhkan atasan untuk menganalisis hal baik dan buruk yang dilakukan karyawan.'},
{c:'PPBR',t:'mc',q:'PPBR di Indogrosir adalah singkatan dari…',o:['Permohonan Pemusnahan Barang Rusak','Pengajuan Pengembalian Barang Retur','Pencatatan Produk Baru Rutin','Permohonan Penjualan Barang Rusak'],e:'PPBR = Permohonan Pemusnahan Barang Rusak. Dilakukan rutin untuk mengurangi stock barang baik pada produk yang tidak layak jual, agar stock barang baik terlacak dan display tidak kosong.'},
{c:'PPBR',t:'order',q:'Urutkan langkah PPBR dari awal sampai akhir!',s:['SORTIR: pisahkan produk tidak layak, 1 plastik untuk 1 produk','INFO: konfirmasi ke Leader/SPV','TIMBANG: pastikan berat sesuai, dilarang memainkan timbangan','CATAT & FOTO: buku pemusnahan dan bukti foto'],e:'Urutan PPBR: Sortir (jangan dicampur), Info ke Leader/SPV, Timbang (memainkan timbangan kena sanksi), lalu Catat & Foto sebagai bukti musnah dengan info produk dan berat yang terlihat.'},
{c:'PPBR',t:'swipe',q:'Kejujuran & dokumentasi: pernyataan ini BENAR atau SALAH?',c2:[['Menambah barang lain di atas timbangan adalah kecurangan',1],['Dokumentasi musnah memuat nama produk, berat, dan tanggal dimusnahkan',1],['Mengganti nama produk dengan yang lebih mahal boleh asal jumlahnya sama',0],['Jika tidak tercatat jelas, tidak akan jadi masalah',0],['Memainkan timbangan saat PPBR bisa terkena sanksi',1]],e:'Kejujuran dan ketepatan administrasi itu mutlak. Menambah beban di timbangan atau mengganti nama dengan produk yang lebih mahal adalah kecurangan. Nama produk, berat, dan tanggal wajib jelas; jika tidak tercatat akan menjadi masalah besar.'},
{c:'KONVERSI & REPACK',t:'mc',q:'Saat display, kamu menemukan melon potong hasil konversi yang sudah berjamur. Apa tindakanmu?',o:['Tarik dari pajangan dan musnahkan sesuai prosedur','Biarkan sampai habis terjual','Pindahkan ke belakang display','Tutup dengan produk baru'],e:'Produk yang tidak layak pajang dan tidak layak konsumsi wajib ditarik dan dimusnahkan sesuai prosedur. Kesesuaian pemajangan adalah tanggung jawab Stand Keeper Perishable.'},
{c:'KONVERSI & REPACK',t:'sort',q:'Pilih administrasi yang tepat untuk setiap kondisi!',b:['MUSNAH','KONVERSI','REPACK'],c2:[['Semangka berjamur, tidak layak jual dan konsumsi',0],['Melon utuh dipotong jadi kemasan kecil siap makan, tanpa campuran',1],['Beberapa buah beda PLU diolah jadi 1 produk salad baru',2],['Pepaya potong berlendir dan berbau',0],['Satu jenis pepaya dipotong dan di-wrap jadi PLU baru',1],['Sisa beberapa buah dicampur jadi 1 jus baru',2]],e:'Musnah (PPBR): mengurangi stock produk tidak layak jual dan konsumsi. Konversi: satu produk diolah dari PLU awal menjadi PLU baru tanpa bercampur produk lain. Repack: beberapa produk (beberapa PLU) diubah menjadi 1 PLU baru.'},
{c:'KONVERSI & REPACK',t:'mc',q:'Kamu mau mengonversi semangka jadi potongan siap makan dengan PLU baru. Apa syarat administrasinya?',o:['Ajukan LPP baru ke MD dan tunggu disetujui','Langsung jual, LPP dibuat sendiri','Cukup izin lisan rekan kerja','LPP baru tidak diperlukan'],e:'Pada konversi, LPP barang awal dipindahkan ke LPP produk lainnya. LPP baru harus diajukan ke MD dan disetujui dulu, jadi tidak boleh asal konversi.'},
{c:'KONVERSI & REPACK',t:'swipe',q:'Repack & konversi: pernyataan ini BENAR atau SALAH?',c2:[['Hasil repack harus lolos uji kelayakan konsumsi dan visual',1],['Atasan diminta mencicipi (Info & Icip) sebelum repack dijual',1],['Setelah di-ACC, cek di kasir apakah harga sudah sesuai',1],['Produk konversi yang sudah dipajang tidak perlu dicek lagi',0],['Harga jual repack boleh dibuat asal, tak perlu sesuai nominal produk yang diolah',0],['Produk konversi yang tidak layak konsumsi wajib turun pajang',1]],e:'Repack: Sortir, Timbang, Olah, Info & Icip, Ajukan harga wajar, Cetak barcode dan label lalu cek di kasir, Pajang dengan POP, Evaluasi respon konsumen. Produk konversi yang sudah dipajang tetap rutin dicek dan wajib turun pajang jika tidak layak.'},
{c:'RETUR',t:'order',q:'Urutkan langkah RETUR barang!',s:['SORTIR produk rusak sesuai ketentuan retur','GABUNG per masing-masing supplier','CATAT dan input retur dengan qty yang benar','ANTAR form retur dan fisik barang ke Stock Keeper 2 (Tim Retur)'],e:'Langkah retur: Sortir (pahami produk apa saja yang bisa diretur), Gabung per supplier, Catat dengan qty benar di komputer atasan, lalu Antar form beserta fisik barang ke Stock Keeper 2.'},
{c:'RETUR',t:'mc',q:'Apakah semua produk pabrikasi yang rusak saat dipajang bisa diretur?',o:['Tidak, tergantung kesepakatan Indogrosir dan supplier','Ya, semuanya pasti bisa','Hanya jika sudah kadaluarsa','Tidak ada yang bisa diretur'],e:'Bisa atau tidaknya diretur tergantung kesepakatan Indogrosir dan supplier. Jika retur ditolak, info atasan agar mendalami penyebabnya.'},
{c:'STOCK OPNAME',t:'sort',q:'Tentukan jadwal Stock Opname minimal tiap produk!',b:['HARIAN','MINGGUAN','BULANAN'],c2:[['Telur',0],['Buah yang laku',0],['Produk yang rutin dimusnahkan',0],['Yogurt dan juice',1],['Buah impor',1],['Produk slow moving, expired panjang',2]],e:'Harian: produk sangat laku (telur, ayam, buah laku) dan yang rutin dimusnahkan. Mingguan minimal 1x: produk pabrikasi laku berexpired pendek (yogurt, juice, minuman botol) dan buah impor. Bulanan minimal 1x: seluruh produk, khususnya slow moving dan expired panjang.'},
{c:'STOCK OPNAME',t:'num',q:'Yogurt wajib SO minimal 1x seminggu. Berapa kali SO minimal dalam 4 minggu?',a:4,u:'kali',e:'Produk pabrikasi laku berexpired pendek seperti yogurt, juice, dan minuman botol wajib SO minimal seminggu 1x. Dalam 4 minggu, berarti minimal 4 kali.'},
{c:'STOCK OPNAME',t:'mc',q:'Apa tugas Stand Keeper Perishable saat Stock Opname?',o:['Hitung stock fisik yang baik dan layak jual dengan benar, lalu lapor atasan','Cocokkan dengan stock komputer lalu sesuaikan angkanya','Hitung semua barang termasuk yang rusak','Tunggu atasan memberi angka stock komputer'],e:'Stand Keeper tidak perlu tahu stock di komputer. Tugasnya menghitung stock fisik barang baik dan layak jual dengan benar, lalu menginformasikannya ke atasan untuk diproses.'}];
const CC={'PPBR':'#e30613','KONVERSI & REPACK':'#d49a00','RETUR':'#0b4ea2','STOCK OPNAME':'#0e9f6e'};
const $=s=>document.querySelector(s),B=$('#B'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sh=a=>[...a].sort(()=>Math.random()-.5);

function face(c,m){const C=FC[c],k=C.k,sk=C.sk,i=C.ink,T=(p,dx,dy)=>`transform="translate(${p[0]+(dx||0)} ${p[1]+(dy||0)}) scale(${k})"`,st=(w,col)=>`stroke="${col||i}" stroke-width="${w}" fill="none" stroke-linecap="round"`;
const eyeP=C.E.map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${15*k}" ry="${19*k}"/>`).join(''),brP=C.pb.map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[3]}"/>`).join(''),moP=`<ellipse cx="${C.M[0]}" cy="${C.M[1]}" rx="${C.pm[0]}" ry="${C.pm[1]}"/>`;

return cover+C.E.map((p,n)=>`<g ${T(p)}><ellipse rx="11" ry="12" fill="${i}"/><circle cx="-3.5" cy="-4" r="3.8" fill="#fff"/><circle cx="3" cy="3" r="1.7" fill="#fff"/><ellipse cy="13" rx="12" ry="3.6" fill="#7cc8ff" opacity=".7"/><path class="tr" style="animation-delay:${n*.5}s" d="M0 14Q7 28 0 37Q-7 28 0 14Z" fill="#5ec3ff"/></g>`).join('')+`<path ${T(C.B[0],0,2)} d="M-13 6Q0 -1 13 -8" ${st(5.5)}/><path ${T(C.B[1],0,2)} d="M-13 -8Q0 -1 13 6" ${st(5.5)}/><path ${T(C.M,0,6)} d="M-14 7Q0 -10 14 7" ${st(4.6,'#7d1d2e')}/>`}

if(m=='happy')e=Array.from({length:6},(_,n)=>`<span style="left:${[2,88,0,92,80,10][n]}%;top:${[8,4,42,36,62,66][n]}%;animation-delay:${n*.12}s">${['✨','⭐','💙','✨','🎉','💛'][n]}</span>`).join('');

let ac;function tn(f,d,t,v){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}

function hud(){$('#xp').textContent='⭐ '+S.xp;const c=$('#cb');c.hidden=S.st<2;c.className='pill fire';c.textContent='🔥 x'+S.st}
function setBar(l,fn,dis){const b=$('#bar');b.innerHTML=l?`<button class="go" ${dis?'disabled':''}>${l}</button>`:'';if(l&&!dis)b.firstChild.onclick=fn}
function render(){S.lock=0;const q=Q[S.i];$('#pg').innerHTML=Q.map((_,k)=>`<i class="${k<S.i?(S.log[k].ok?'y':'n'):k==S.i?'c':''}"></i>`).join('');const ch=$('#chp');ch.textContent=q.c;ch.style.background=CC[q.c];$('#qt').textContent=q.q;hud();mood('idle');setBar('');B.scrollTop=0;R[q.t](q)}
const dtl=(h,l)=>l.length?`<p class="dt"><b>${h}</b></p>`+l.map(x=>`<p class="dt">${x}</p>`).join(''):'';
function fx(ok){tn(ok?880:180,.1,ok?'sine':'sawtooth',.09);vib(ok?12:[30,20,30]);mood(ok?'happy':'sad')}
function fin(ok,f,det){if(S.lock)return;S.lock=1;const q=Q[S.i],xp=Math.round(10*f);S.xp+=xp;S.st=ok?S.st+1:0;S.best=Math.max(S.best,S.st);S.log.push({q:q.q,ok,e:q.e});hud();mood(ok?'happy':'sad');sfx(ok);if(ok)confetti();setBar('');
later(()=>{const t=ok?['Mantap!','Tepat sekali!','Keren banget!'][S.i%3]:f>0?'Hampir benar!':'Belum tepat',p=$('#shp');p.className='p '+(ok?'':f>0?'mid':'no');
p.innerHTML=`<div class="hd"><div class="m" id="sm">${mas(ok?'happy':'sad',S.g)}</div><div><h2>${t}</h2><span class="xp">+${xp} XP</span>${S.st>1?`<span class="xp">🔥 Combo x${S.st}</span>`:''}</div></div>${det||''}<div class="ex"><b>📘 Pembahasan</b><br>${esc(q.e)}</div><button class="go" id="nx" type="button">${S.i==Q.length-1?'LIHAT HASIL 🏆':'LANJUT ➜'}</button>`;$('#sh').classList.add('on');$('#nx').onclick=()=>{$('#sh').classList.remove('on');tn(520,.06,'square',.08);S.i++;S.i<Q.length?render():result()}},ok?800:650)}
const R={};
R.mc=q=>{const o=sh(q.o.map((t,i)=>[t,i==0]));B.innerHTML=`<p class="hint">Pilih satu jawaban paling tepat.</p>`+o.map(([t,c],k)=>`<button class="opt" data-c="${+c}"><i>${'ABCD'[k]}</i>${esc(t)}</button>`).join('');
B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.c=='1';B.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c=='1')x.classList.add('ok')});if(!ok)b.classList.add('no');fin(ok,+ok,'')})};
R.swipe=q=>{let i=0,rg=0,dt=[];B.innerHTML=`<p class="hint">Geser kartu ke kanan = BENAR, ke kiri = SALAH (atau pakai tombol).</p><div class="deck" id="dk"></div><div class="two"><button class="bt no" data-v="0">✕ SALAH</button><button class="bt ok" data-v="1">✓ BENAR</button></div>`;const dk=$('#dk');
const draw=()=>{dk.innerHTML=`<div class="card back"></div><div class="card" id="tc">${esc(q.c2[i][0])}</div><span class="cnt">${i+1} / ${q.c2.length}</span>`;drag($('#tc'))};
function ans(v,el){if(!el||el.dataset.l)return;el.dataset.l=1;const c=q.c2[i],ok=v==c[1];if(ok)rg++;else dt.push(`✕ ${esc(c[0])} → <b>${c[1]?'BENAR':'SALAH'}</b>`);fx(ok);el.style.transition='.3s';el.style.transform=`translateX(${v?440:-440}px) rotate(${v?28:-28}deg)`;el.style.opacity=0;
later(()=>{i++;i<q.c2.length?draw():fin(rg==q.c2.length,rg/q.c2.length,dtl('Yang perlu dibenahi:',dt))},280)}
function drag(el){let x0=null,dx=0;el.onpointerdown=e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};el.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/12}deg)`;el.dataset.s=dx>40?1:dx<-40?0:''};el.onpointercancel=el.onpointerup=()=>{if(x0==null)return;x0=null;if(Math.abs(dx)>80)ans(dx>0?1:0,el);else{el.style.transition='.25s';el.style.transform='';el.dataset.s=''}dx=0}}
B.querySelectorAll('.two .bt').forEach(b=>b.onclick=()=>ans(+b.dataset.v,$('#tc')));draw()};
R.sort=q=>{let i=0,rg=0,dt=[];B.innerHTML=`<p class="hint">Ketuk kotak yang tepat untuk kartu ini.</p><div class="deck"><div class="card back"></div><div class="card" id="tc"></div><span class="cnt" id="ct"></span></div><div class="bk" style="grid-template-columns:repeat(${q.b.length},1fr)">${q.b.map((t,k)=>`<button class="bt" data-k="${k}">${esc(t)}</button>`).join('')}</div>`;
const show=()=>{const t=$('#tc');t.removeAttribute('style');t.removeAttribute('data-l');t.textContent=q.c2[i][0];$('#ct').textContent=`${i+1} / ${q.c2.length}`};show();
B.querySelectorAll('.bk .bt').forEach(b=>b.onclick=()=>{const t=$('#tc');if(t.dataset.l)return;t.dataset.l=1;const c=q.c2[i],ok=+b.dataset.k==c[1];if(ok)rg++;else dt.push(`✕ ${esc(c[0])} → <b>${esc(q.b[c[1]])}</b>`);fx(ok);t.style.transition='.3s';t.style.transform='translateY(130px) scale(.4)';t.style.opacity=0;
later(()=>{i++;i<q.c2.length?show():fin(rg==q.c2.length,rg/q.c2.length,dtl('Yang perlu dibenahi:',dt))},300)})};
R.order=q=>{const it=sh(q.s.map((t,i)=>({t,i})));let pk=[];B.innerHTML=`<p class="hint">Ketuk langkah sesuai urutan. Ketuk kotak terisi untuk membatalkan.</p><div id="sl"></div><div id="pl"></div>`;
const draw=()=>{$('#sl').innerHTML=q.s.map((_,k)=>`<div class="slot ${pk[k]!=null?'f':''}" data-k="${k}"><b>${k+1}</b>${pk[k]!=null?esc(q.s[pk[k]]):''}</div>`).join('');$('#pl').innerHTML=it.filter(x=>!pk.includes(x.i)).map(x=>`<button class="chip" data-i="${x.i}">${esc(x.t)}</button>`).join('');
$('#sl').querySelectorAll('.f').forEach(e=>e.onclick=()=>{pk.splice(+e.dataset.k,1);draw()});$('#pl').querySelectorAll('.chip').forEach(e=>e.onclick=()=>{tn(500,.05,'square',.07);pk.push(+e.dataset.i);draw()});
const full=pk.length==q.s.length;setBar('CEK URUTAN',()=>{const n=pk.filter((v,k)=>v==k).length,ok=n==q.s.length;fx(ok);fin(ok,n/q.s.length,ok?'':dtl('Urutan yang benar:',q.s.map((t,k)=>`${k+1}. ${esc(t)}`)))},!full)};draw()};
R.num=q=>{let v=0;B.innerHTML=`<p class="hint">Atur angka dengan tombol − dan +.</p><div class="step"><button class="bt" id="mn" type="button">−</button><div class="big"><span id="nv">0</span><small>${q.u}</small></div><button class="bt" id="pl" type="button">+</button></div>`;
const u=d=>{v=Math.max(0,Math.min(99,v+d));$('#nv').textContent=v;tn(400+v*30,.05,'square',.07)};$('#mn').onclick=()=>u(-1);$('#pl').onclick=()=>u(1);
setBar('CEK JAWABAN',()=>{const ok=v==q.a;fin(ok,+ok,ok?'':`<p class="dt">Jawaban benar: <b>${q.a} ${q.u}</b></p>`)})};
function result(){show('s2');const n=S.log.filter(x=>x.ok).length,max=Q.length*10,p=Math.round(S.xp/max*100);mood(p>=70?'happy':'idle',$('#rm'));confetti();tn(523,.15,'square',.1);setTimeout(()=>tn(784,.25,'square',.1),130);
$('#rt').textContent=p>=90?'Master Administrasi!':p>=70?'Stand Keeper Handal!':'Terus Semangat!';$('#rs').textContent=$('#wn').textContent+(p>=70?', administrasi Perishable-mu siap dipakai di lapangan.':', pelajari lagi pembahasan di bawah, lalu coba ulangi.');
$('#rst').innerHTML=`<div><b>${S.xp}</b>XP dari ${max}</div><div><b>${n}/${Q.length}</b>Soal benar</div><div><b>x${S.best}</b>Combo terbaik</div>`;
$('#rv').innerHTML=S.log.map((x,k)=>`<div class="rv ${x.ok?'':'n'}">${x.ok?'✅':'❌'} ${k+1}. ${esc(x.q)}<small>${esc(x.e)}</small></div>`).join('')}
</script></body></html>
